<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>The daily loop</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: #0d1117; color: #f0f6fc; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif; padding: 2rem; }
    .eyebrow { font-family: ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace; font-size: 0.7rem; letter-spacing: 0.16em; text-transform: uppercase; color: #9198a1; margin-bottom: 0.4rem; }
    h1 { font-size: 1.5rem; font-weight: 600; margin-bottom: 1.25rem; }
    svg { display: block; max-width: 100%; height: auto; }
  </style>
</head>
<body>
  <p class="eyebrow">Flowchart · GitHub Primer skin (dark)</p>
  <h1>The daily loop</h1>
  <svg viewBox="0 0 832 304" width="832" height="304" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="daily-loop-dark-title daily-loop-dark-desc">
      <title id="daily-loop-dark-title">The daily loop</title>
      <desc id="daily-loop-dark-desc">/morning shows the day's blocks and minimum, blocks happen or don't, /evening closes the day and plans the next one and writes one factual entry to the patterns log; an observation becomes a confirmed pattern only on its third repeat.</desc>
      <defs><marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#9198a1"/></marker><marker id="arrow-focal" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#f0883e"/></marker></defs>
      <rect width="100%" height="100%" fill="#0d1117"/>
      <rect x="16" y="168" width="800" height="120" rx="8" fill="#151b23" stroke="#3d444d" stroke-width="1"/>
      <text x="32" y="190" fill="#9198a1" font-size="11" font-weight="500" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" letter-spacing="0.1em">LIFE/PATTERNS/</text>
      <path d="M 256 96 H 294" fill="none" stroke="#9198a1" stroke-width="1.5" marker-end="url(#arrow)"/>
      <path d="M 536 96 H 574" fill="none" stroke="#9198a1" stroke-width="1.5" marker-end="url(#arrow)"/>
      <path d="M 696 64 V 44 A 8 8 0 0 0 688 36 H 144 A 8 8 0 0 0 136 44 V 62" fill="none" stroke="#9198a1" stroke-width="1.5" marker-end="url(#arrow)"/>
      <path d="M 680 128 V 206" fill="none" stroke="#9198a1" stroke-width="1.5" marker-end="url(#arrow)"/>
      <path d="M 560 240 H 258" fill="none" stroke="#f0883e" stroke-width="1.5" stroke-dasharray="5,4" marker-end="url(#arrow-focal)"/>
      <rect x="383.2" y="15" width="65.6" height="15" rx="2" fill="#0d1117"/>
      <text x="416" y="26" fill="#9198a1" font-size="11" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" text-anchor="middle" letter-spacing="0.06em">NEXT DAY</text>
      <rect x="350.0" y="217" width="116.0" height="15" rx="2" fill="#151b23"/>
      <text x="408" y="228" fill="#f0883e" font-size="11" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" text-anchor="middle" letter-spacing="0.06em">3RD REPEAT ONLY</text>
      <rect x="16" y="64" width="240" height="64" rx="6" fill="#0d1117" stroke="#3d444d" stroke-width="1"/>
      <text x="136.0" y="93.0" fill="#f0f6fc" font-size="14" font-weight="600" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" text-anchor="middle">/morning</text>
      <text x="136.0" y="111.0" fill="#9198a1" font-size="12" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" text-anchor="middle">show today's blocks + minimum</text>
      <rect x="296" y="64" width="240" height="64" rx="6" fill="#0d1117" stroke="#3d444d" stroke-width="1"/>
      <text x="416.0" y="93.0" fill="#f0f6fc" font-size="14" font-weight="600" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" text-anchor="middle">Blocks happen</text>
      <text x="416.0" y="111.0" fill="#9198a1" font-size="12" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" text-anchor="middle">(or don't)</text>
      <rect x="576" y="64" width="240" height="64" rx="6" fill="#0d1117" stroke="#3d444d" stroke-width="1"/>
      <text x="696.0" y="93.0" fill="#f0f6fc" font-size="14" font-weight="600" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" text-anchor="middle">/evening</text>
      <text x="696.0" y="111.0" fill="#9198a1" font-size="12" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" text-anchor="middle">close today, plan tomorrow</text>
      <rect x="560" y="208" width="240" height="64" rx="6" fill="#0d1117" stroke="#3d444d" stroke-width="1"/>
      <text x="680.0" y="237.0" fill="#f0f6fc" font-size="14" font-weight="600" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" text-anchor="middle">observation-log.md</text>
      <text x="680.0" y="255.0" fill="#9198a1" font-size="12" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" text-anchor="middle">one factual entry, zero interpretation</text>
      <rect x="32" y="208" width="224" height="64" rx="6" fill="#271a10" stroke="#f0883e" stroke-width="1.5"/>
      <text x="144.0" y="237.0" fill="#f0883e" font-size="14" font-weight="600" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" text-anchor="middle">patterns.md</text>
      <text x="144.0" y="255.0" fill="#f0883e" font-size="12" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" text-anchor="middle">confirmed pattern</text>
    </svg>
</body>
</html>
