        <title id="inside-guardrails-dark-title">Rules that code enforces, not the model</title>
        <desc id="inside-guardrails-dark-desc">Three checks in the order they fire during a Library ingest, plus the status script: the PreToolUse hook library.py pre refuses any write under Library/sources except a new file in inbox; the PostToolUse hook library.py post checks the one wiki page just saved for frontmatter, id, kind, status, sources and a 120-line limit (250 for procedures); lint.py runs at the end of every ingest across the whole wiki in 12 groups of checks. On the Life side vault-status.py computes avatar age, days since the last /weekly, gaps in the daily loop, queue sizes and overdue phases; /weekly runs it first and the Hub Status tab shows its status.json snapshot.</desc>

        <text xml:space="preserve" x="56" y="319" font-family="'Geist', system-ui, sans-serif" font-size="10.5" fill="#f5f5f5" text-anchor="start">Sources can be moved, never edited.</text>

        <text xml:space="preserve" x="360" y="319" font-family="'Geist', system-ui, sans-serif" font-size="10.5" fill="#f5f5f5" text-anchor="start">120 lines at most (procedure: 250)</text>

        <text x="360" y="352" font-family="'Geist Mono', ui-monospace, monospace" font-size="8" font-weight="500" letter-spacing="0.14em" fill="#bfc0c0" text-anchor="start">IF IT FAILS</text>

        <text xml:space="preserve" x="360" y="370" font-family="'Geist', system-ui, sans-serif" font-size="10.5" fill="#bfc0c0" text-anchor="start">“Fix this now, not at the end</text>
        <text xml:space="preserve" x="360" y="385" font-family="'Geist', system-ui, sans-serif" font-size="10.5" fill="#bfc0c0" text-anchor="start">of the ingest.”</text>

        <text xml:space="preserve" x="56" y="556" font-family="'Geist', system-ui, sans-serif" font-size="10.5" fill="#bfc0c0" text-anchor="start">avatar age · days since the last <tspan font-family="'Geist Mono', ui-monospace, monospace" font-size="9.5" fill="#f5f5f5">/weekly</tspan></text>
        <text xml:space="preserve" x="56" y="572" font-family="'Geist', system-ui, sans-serif" font-size="10.5" fill="#bfc0c0" text-anchor="start">gaps in the daily loop · queue sizes</text>
        <text xml:space="preserve" x="56" y="588" font-family="'Geist', system-ui, sans-serif" font-size="10.5" fill="#bfc0c0" text-anchor="start">an active phase past its target date</text>
