<body>

      <title id="library-pipeline-dark-title">The Library pipeline</title>
      <desc id="library-pipeline-dark-desc">Clipped articles, notes and transcripts land in the inbox; /library compiles them one file at a time, and only a real mechanism becomes a wiki page with a source citation wired into its folder's MOC, while a mere pointer becomes one line in the catalog.</desc>

      <path d="M 416 88 V 150" fill="none" stroke="#9198a1" stroke-width="1.5" marker-end="url(#arrow)"/>
      <path d="M 520 216 H 606" fill="none" stroke="#9198a1" stroke-width="1.5" marker-end="url(#arrow)"/>
      <path d="M 712 248 V 334" fill="none" stroke="#9198a1" stroke-width="1.5" marker-end="url(#arrow)"/>
      <path d="M 312 216 H 242" fill="none" stroke="#9198a1" stroke-width="1.5" marker-end="url(#arrow)"/>

      <rect x="426.0" y="123" width="126.8" height="15" rx="2" fill="#0d1117"/>
      <text x="430" y="134" fill="#9198a1" font-size="12" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" text-anchor="start">one file at a time</text>
      <rect x="527.6" y="195" width="72.8" height="15" rx="2" fill="#0d1117"/>
      <text x="564" y="206" fill="#9198a1" font-size="11" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" text-anchor="middle" letter-spacing="0.06em">MECHANISM</text>
      <rect x="246.8" y="195" width="58.4" height="15" rx="2" fill="#0d1117"/>

      <text x="128.0" y="71.0" fill="#9198a1" font-size="12" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" text-anchor="middle">article, note, transcript</text>
      <rect x="304" y="24" width="224" height="64" rx="6" fill="#0d1117" stroke="#3d444d" stroke-width="1"/>
      <text x="416.0" y="53.0" fill="#f0f6fc" font-size="14" font-weight="600" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" text-anchor="middle">Inbox</text>

      <text x="416" y="236" fill="#f0883e" font-size="12" font-weight="400" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" text-anchor="middle">or just a pointer?</text>

      <rect x="608" y="336" width="208" height="64" rx="6" fill="#0d1117" stroke="#3d444d" stroke-width="1"/>
      <text x="712.0" y="365.0" fill="#f0f6fc" font-size="14" font-weight="600" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" text-anchor="middle">Folder's MOC</text>
      <text x="712.0" y="383.0" fill="#9198a1" font-size="12" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" text-anchor="middle">wired in, not just appended</text>
      <rect x="16" y="184" width="224" height="64" rx="6" fill="#0d1117" stroke="#3d444d" stroke-width="1"/>
      <text x="128.0" y="213.0" fill="#f0f6fc" font-size="14" font-weight="600" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" text-anchor="middle">One line</text>
